<!-- =============================================================================
     HobbyMate – App Shell Fragment
     Canonical source: HobbyMate/shared/shell.html
     Vendored copy in each service. Re-sync from here when the shell changes.

     Usage:
       • Copy the HEADER and FOOTER blocks into your service's index.html.
       • Replace CURRENT_SERVICE_ID with "numdraw" or "crossstitch" to
         activate the correct nav link (adds hm-nav__link--active class).
       • Keep the Google Fonts <link> in your <head>.
       • Load theme.css BEFORE your service-specific styles.
     ============================================================================= -->

<!-- ── Google Fonts (place in <head>) ────────────────────────────────────────── -->

-->

<!-- ── Site header ───────────────────────────────────────────────────────────── -->
<header class="hm-header" role="banner">
  <div class="hm-header__inner">
    <a href="../index.html" class="hm-header__logo" aria-label="HobbyMate home">
      <div class="hm-header__logo-icon" aria-hidden="true">🧵</div>
      <span class="hm-header__logo-text">Hobby<span>Mate</span></span>
    </a>

    <div class="hm-header__divider" aria-hidden="true"></div>

    <nav class="hm-nav" aria-label="Main navigation">
      <a href="../numdraw/index.html"
         class="hm-nav__link"
         id="hm-nav-numdraw">
        <span class="hm-nav__link-icon" aria-hidden="true">🎨</span>
        <span class="hm-nav__link-label">Paint by Numbers</span>
      </a>
      <a href="../crossstitch/index.html"
         class="hm-nav__link"
         id="hm-nav-crossstitch">
        <span class="hm-nav__link-icon" aria-hidden="true">✂️</span>
        <span class="hm-nav__link-label">Cross Stitch</span>

    </nav>
  </div>
</header>

</footer>
